# POJUN Tencent TSec Benchmark evaluation image — local one-command build + run.
# Independent of the production docker-compose.yml (multi-service: pojun+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # set LLM_API_KEY / BENCHMARK_TOKEN etc.
#   docker compose -f docker-compose.bench.yml up --build      # build and run in foreground (watch logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # stop (add -v to also delete the data volume)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  pojun-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: pojun-bench:latest
    container_name: pojun-bench
    env_file:
      - bench/.env
    # Share the physical host's network: the container uses the host network
    # stack directly, so it can reach lab target networks on the host/VPN.
    # In host mode no `ports` mapping is needed; the container binds host ports
    # directly: 8787 (UI/API), 8788 (proxy), and the internal PostgreSQL 5432 —
    # make sure those three host ports are free (stop local services that use
    # them before testing).
    network_mode: host
    restart: "no"

volumes:
  pojun_bench_data:
