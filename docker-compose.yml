# Windows (Docker Desktop) users: start with -f docker-compose.windows.yml:
#   docker compose -f docker-compose.yml -f docker-compose.windows.yml up -d
# It swaps data/ to a named volume (small-file I/O over an NTFS bind mount is
# measured ~2 orders of magnitude slower, which makes traffic/evidence writes
# noticeably sluggish) and opens the reverse-connection port mapping.
# See the header comment in docker-compose.windows.yml and the Windows section
# of docs/Deployment Manual.md for details.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pojun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pojun}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pojun} -d ${POSTGRES_DB:-pojun}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pojun:
    # The image is published to both GHCR and Docker Hub; GHCR is the default
    # (the release workflow always pushes there). Override with POJUN_IMAGE to
    # use the other source.
    image: ${POJUN_IMAGE:-ghcr.io/chu0119/pojun}:${POJUN_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POJUN_PG_DSN: postgres://${POSTGRES_USER:-pojun}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pojun}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POJUN_LLM_PROVIDER: ${POJUN_LLM_PROVIDER:-}
      POJUN_LLM_MODEL: ${POJUN_LLM_MODEL:-}
      POJUN_LLM_BASE_URL: ${POJUN_LLM_BASE_URL:-}
      POJUN_LLM_PROXY: ${POJUN_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
      # Reverse-connection port mapping (open as needed): ports that MSF/listener
      # inside the container listens on must be mapped to the host for the agent
      # to receive a reverse shell. Example (uncomment and adjust as needed):
      # - "4444-4450:4444-4450"
    volumes:
      # Bind the data directory (jwt.key, SQLite, etc.) to data/ at the project
      # root: easy to inspect/back up from the host, and survives container
      # recreation.
      - ./data:/app/data
      # Mount the project-root skills directory into the container (overrides
      # the /app/skills baked into the image); skill edits need no image rebuild,
      # the container reads the host copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
